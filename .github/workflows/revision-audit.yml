name: Revision certificate audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certificates:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: submission/v1.5.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Complete Lucas certificates and exact root-data match
        run: python -I lucas_certificates.py --verify verification/k14-lucas-certificates.json
      - name: Exact candidate consistency checks
        run: python single_candidate.py
      - name: Targeted valuation and residue controls
        run: |
          python valuation_route.py
          python residue_route.py
